<!DOCTYPE html>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
function handleLogin() {
  doSignIn(() => bootAuth(() => {}), email => alert('Accesso non abilitato per ' + email + '.'));
}
bootAuth(() => {});
</script>
<script src="https://accounts.google.com/gsi/client" async></script>
